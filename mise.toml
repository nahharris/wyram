[tools]
erlang = "29.1.1"
elixir = "1.20.4-otp-29"
rust = "1.98.1"

[settings]
lockfile = true

[settings.erlang]
compile = false

[tasks.doctor]
run = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/doctor.ps1"

[tasks.setup]
run = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/setup.ps1"

[tasks.fmt]
run = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/fmt.ps1"

[tasks.check]
run = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check.ps1"

[tasks.test]
run = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test.ps1"

[tasks.dev]
run = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/dev.ps1"

[tasks."dev:agent"]
run = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/dev-agent.ps1"

[tasks.control]
run = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/control.ps1"

[tasks."dev:perf"]
run = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/dev.ps1 -Profile perf"

[tasks."dev:agent:perf"]
run = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/dev-agent.ps1 -Profile perf"

[tasks.bench]
run = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/bench.ps1"

[tasks."perf:report"]
run = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/client-perf-report.ps1"

[tasks."bench:mesh"]
run = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/bench-mesh.ps1"

[tasks."bench:outbound"]
run = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/bench-outbound.ps1"

[tasks.package]
run = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package.ps1"
