[workspace]
members = ["crates/wyram_core", "crates/wyram_nif", "crates/wyram_client"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
wyram_core = { path = "crates/wyram_core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
